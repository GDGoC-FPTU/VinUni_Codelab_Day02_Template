<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#132238}.title{font-size:34px;font-weight:700}.sub{font-size:18px}.label{font-size:20px;font-weight:700}.small{font-size:16px}.box{stroke:#1e4f85;stroke-width:3;rx:18;ry:18}.arrow{stroke:#426b94;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#426b94"/></marker></defs><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="75" class="title">Current-State Workflow — Vehicle Health &amp; Predictive Maintenance</text><text x="70" y="110" class="sub">VinFast: telemetry/DTC → triage → service outcome (thời gian là giả định cần đo pilot)</text><rect x="55" y="235" width="230" height="180" class="box" fill="#dbeeff"/><text x="80" y="280" class="label">1. Xe/backend</text><text x="80" y="315" class="small">Ghi telemetry + DTC</text><text x="80" y="350" class="small">Near-real-time / theo lô</text><rect x="345" y="235" width="245" height="180" class="box" fill="#dbeeff"/><text x="370" y="280" class="label">2. Cảnh báo/ticket</text><text x="370" y="315" class="small">Chủ xe hoặc CSKH</text><text x="370" y="350" class="small">2–5 phút</text><rect x="650" y="235" width="265" height="180" class="box" fill="#fff0d9"/><text x="675" y="280" class="label">3. Kỹ thuật triage</text><text x="675" y="315" class="small">Đọc DTC + trend + lịch sử</text><text x="675" y="350" class="small">[BOTTLENECK] 10–20 phút</text><rect x="975" y="235" width="255" height="180" class="box" fill="#e5f6e9"/><text x="1000" y="280" class="label">4. Cố vấn dịch vụ</text><text x="1000" y="315" class="small">Liên hệ / đề xuất lịch</text><text x="1000" y="350" class="small">5–10 phút</text><rect x="1290" y="235" width="240" height="180" class="box" fill="#dbeeff"/><text x="1315" y="280" class="label">5. Xưởng</text><text x="1315" y="315" class="small">Kiểm tra + sửa chữa</text><text x="1315" y="350" class="small">Ghi outcome/nhãn</text><path d="M285 325 H340 M590 325 H645 M915 325 H970 M1230 325 H1285" class="arrow"/><text x="320" y="455" class="small">[HANDOFF] xe/khách hàng → service</text><text x="945" y="455" class="small">[HANDOFF] triage → cố vấn/xưởng</text><rect x="180" y="600" width="1240" height="160" rx="18" fill="#fff" stroke="#9fb4c8" stroke-width="2"/><text x="220" y="650" class="label">Rủi ro cần kiểm soát trước khi đưa AI vào</text><text x="220" y="690" class="small">• Telemetry thiếu/stale hoặc lệch schema  • Anomaly score không phải nguyên nhân gốc  • Không tự xóa DTC, điều khiển xe hay kết luận xe an toàn</text><text x="220" y="725" class="small">• Alert severity cao phải theo SOP và human approval; outcome xưởng là feedback để đánh giá model</text></svg>
